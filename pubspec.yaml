name: tetris
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_displaymode: ^0.7.0
  video_player: ^2.11.1
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/juego.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/juego.png
    - assets/fondo.mp4
    - assets/musica_fondo.mp3